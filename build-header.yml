# Rebuilds header.svg whenever you change build_header.py.
# Save this file in your repo at:  .github/workflows/build-header.yml
name: Build header

on:
  push:
    paths:
      - build_header.py
  workflow_dispatch:   # also lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate header.svg
        run: python3 build_header.py

      - name: Commit the new header
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add header.svg
          if git diff --cached --quiet; then
            echo "Header unchanged, nothing to commit."
          else
            git commit -m "Rebuild header"
            git push
          fi